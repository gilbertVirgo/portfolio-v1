<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup loading state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://use.typekit.net/jnj6xdu.css">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
/* Same rule as Main.dc.html's .capture:not(.loaded), held on so the state can be seen */
.skel { background: linear-gradient(100deg, #e9e9e9 40%, #f5f5f5 50%, #e9e9e9 60%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</helmet>
<div style="width: 1200px; height: 620px; padding: 40px; background: #A8192E; color: #ffffff; font-family: 'sets-grotesk-l', 'Inter Tight', system-ui, sans-serif; font-size: 15px; line-height: 1.35; letter-spacing: -0.01em; display: flex; flex-direction: column; gap: 24px">
<span style="font-weight: 600">Mockup screens shimmer until they load, then the capture appears. Reduced motion: flat grey.</span>
<div style="display: flex; gap: 48px; align-items: flex-end">
<div style="flex: 4 1 0; min-width: 0">
<div style="background: #0d0d0d; padding: 1.4%; border-radius: 18px 18px 0 0">
<div class="skel" role="img" aria-label="Laptop screen loading" style="aspect-ratio: 16 / 10; border-radius: 4px"></div>
</div>
<div style="height: 14px; background: #0d0d0d; border-top: 1px solid #3a3a3a; border-radius: 0 0 14px 14px; margin: 0 -2%"></div>
</div>
<div style="flex: 1 1 0; max-width: 220px; min-width: 0; background: #0d0d0d; padding: 8px; border-radius: 34px">
<div class="skel" role="img" aria-label="Phone screen loading" style="aspect-ratio: 9 / 19.5; border-radius: 26px"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":620}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
